name: Deploy to Railway

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [] # run after CI passes in real setup — add: [unit-tests, e2e-tests]
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      API_URL: ${{ secrets.API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: npm install -g @railway/cli

      - name: Deploy API
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: railway up --service api --detach

      - name: Deploy Scraper
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: railway up --service scraper --detach

      - name: Deploy Notifications
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: railway up --service notifications --detach

      - name: Deploy Web App
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: railway up --service webapp --detach

      - name: Health check post-deploy
        if: ${{ env.RAILWAY_TOKEN != '' && env.API_URL != '' }}
        run: |
          sleep 30
          curl --fail ${{ env.API_URL }}/health || exit 1
