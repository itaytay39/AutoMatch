[build]
builder = "dockerfile"

# ── API ────────────────────────────────────────────────────────
[[services]]
name = "api"
dockerfilePath = "services/api/Dockerfile"
healthcheckPath = "/health"
healthcheckTimeout = 30

[services.deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services.variables]]
name = "NODE_ENV"
value = "production"

[[services.variables]]
name = "PORT"
value = "3000"

# ── Scraper ────────────────────────────────────────────────────
[[services]]
name = "scraper"
dockerfilePath = "services/scraper/Dockerfile"

[services.deploy]
restartPolicyType = "always"

[[services.variables]]
name = "NODE_ENV"
value = "production"

[[services.variables]]
name = "PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD"
value = "1"

# ── Notifications ──────────────────────────────────────────────
[[services]]
name = "notifications"
dockerfilePath = "services/notifications/Dockerfile"

[services.deploy]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services.variables]]
name = "NODE_ENV"
value = "production"
